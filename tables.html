<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
   
    <h1>Tables in HTML</h1>

    <table border="1">
        <tr>
            <td>HTML</td>
            <td>Structure</td>
        </tr>
        
        <tr>
            <td>CSS</td>
            <td>Styking</td>
                    
        </tr>

        <tr>
            <td>JS</td>
            <td>Functionalities</td>
        </tr>
        
        <tr>
            <td>NodeJS</td>
            <td>Backend</td>
    
        </tr>
        <tr>
            <td>ExpressJS</td>
            <td>HTTPS</td>
        </tr>
    </table>

    <hr>
     
    <table border="1">
        <thead>
          <tr>
            <th>Product</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Laptop</td>
            <td>$1000</td>
          </tr>
          <tr>
            <td>Phone</td>
            <td>$600</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td>Total</td>
            <td>$1600</td>
          </tr>
        </tfoot>
      </table>

      <table border="1">
        <tr>
          <th rowspan="2">Name</th>
          <th colspan="2">Marks</th>
        </tr>
        <tr>
          <th>Math</th>
          <th>Science</th>
        </tr>
        <tr>
          <td>Sunaina</td>
          <td>95</td>
          <td>90</td>
        </tr>
      </table>

</body>
</html>
